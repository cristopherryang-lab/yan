
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virus Prank</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    text-align:center;
}

.flash{
    animation:flash .12s infinite;
}

@keyframes flash{
    0%{background:#000;}
    25%{background:#8b0000;}
    50%{background:#ff0000;}
    75%{background:#220000;}
    100%{background:#000;}
}

.container{
    max-width:700px;
    padding:20px;
}

h1{
    font-size:55px;
    color:#ff3333;
}

h2{
    margin-top:15px;
    font-size:28px;
}

#countdown{
    font-size:100px;
    color:yellow;
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>
<body>
<div class="container" id="mainContainer" style="display:none;">
    <div id="promptWrapper">
        <h1>⚠ WARNING ⚠</h1>
        <h2>Installing Virus...</h2>
        <h2>Please wait...</h2>
        <div id="countdown">3</div>
    </div>
</div>

<div id="introScreen" style="
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    width:100%;
    height:100vh;
">
    <button id="introBtn" style="
        padding:20px 45px;
        font-size:22px;
        border:none;
        border-radius:10px;
        background:red;
        color:white;
        cursor:pointer;
    ">CLICK HERE</button>
</div>

<!-- Put siren.mp3 AND laughing_cat.mp3 in the SAME folder as this HTML -->
<audio id="alarm" loop>
    <source src="siren.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<audio id="catSound">
    <source src="cat-laugh-meme-1.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<script>

const countdown = document.getElementById("countdown");
const alarm = document.getElementById("alarm");
const catSound = document.getElementById("catSound");

const introScreen = document.getElementById("introScreen");
const introBtn = document.getElementById("introBtn");
const mainContainer = document.getElementById("mainContainer");

// Ang ONE CLICK na ito lang ang makikitang UI. Pagkatapos nito,
// tuloy-tuloy na yung siren, countdown, flash, hanggang sa reveal
// at cat sound — walang additional click na kailangan.
introBtn.addEventListener("click", ()=>{
    introScreen.style.display = "none";
    mainContainer.style.display = "block";
    startPrank();
});

function startPrank(){

    document.body.classList.add("flash");

    // Play siren
    alarm.volume = 1;
    alarm.play().catch(err=>{
        console.log("Audio blocked:",err);
    });

    let n = 3;
    countdown.textContent = n;

    const timer = setInterval(()=>{

        n--;
        countdown.textContent = n;

        if(n<=0){

            clearInterval(timer);

            // Stop siren
            alarm.pause();
            alarm.currentTime = 0;

            document.body.classList.remove("flash");

            // Make the container fill the screen with a white background
            // for the reveal (instead of replacing the WHOLE body, which
            // would destroy the audio elements and stop the sound).
            mainContainer.style.cssText = `
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                width:100%;
                height:100vh;
                max-width:none;
                background:white;
            `;

            document.getElementById("promptWrapper").innerHTML = `
                <img
                src="haha.jfif"
                style="
                width:320px;
                border-radius:20px;
                box-shadow:0 0 20px rgba(0,0,0,.3);
                ">

                <h1 style="
                    color:black;
                    margin-top:25px;
                    font-size:55px;
                ">
                😂😂😂
                </h1>
                    
                <h2 style="
                    color:black;
                    margin-top:10px;
                ">
                Haha! Tangina mo jrco Escaran Ml Potangina mo HAHA😂😹
                </h2>
            `;

            // Play laughing cat sound
            catSound.volume = 1;
            catSound.play().catch(err=>{
                console.log("Cat sound blocked:",err);
            });

        }

    },1000);

}

</script>
</body>
</html>
